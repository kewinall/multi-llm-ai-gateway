apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-multi-llm-ai-gateway
  labels:
    app.kubernetes.io/name: multi-llm-ai-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  STATE_BACKEND: {{ .Values.config.stateBackend | quote }}
  REDIS_PREFIX: {{ .Values.config.redisPrefix | quote }}
  ROUTING_POLICY: {{ .Values.config.routingPolicy | quote }}
  RATE_LIMIT_REQUESTS_PER_MINUTE: {{ .Values.config.rateLimitRequestsPerMinute | quote }}
  PROVIDER_RETRY_ATTEMPTS: {{ .Values.config.providerRetryAttempts | quote }}
  CIRCUIT_FAILURE_THRESHOLD: {{ .Values.config.circuitFailureThreshold | quote }}
  CIRCUIT_RECOVERY_SECONDS: {{ .Values.config.circuitRecoverySeconds | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otelServiceName | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  OIDC_JWKS_URL: {{ .Values.config.oidcJwksUrl | quote }}
  OIDC_ROLE_CLAIM: {{ .Values.config.oidcRoleClaim | quote }}
  OIDC_NAME_CLAIM: {{ .Values.config.oidcNameClaim | quote }}
  OIDC_DEFAULT_ROLE: {{ .Values.config.oidcDefaultRole | quote }}
