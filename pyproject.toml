[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-llm-ai-gateway"
version = "0.4.0"
description = "OpenAI-compatible enterprise LLM gateway with dynamic governance and RBAC."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "kewinall" }]
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "opentelemetry-api>=1.30,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.51b0,<1.0",
  "opentelemetry-sdk>=1.30,<2.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "redis>=5.2,<8.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
