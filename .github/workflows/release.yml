name: Release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Container build
        run: docker build -t multi-llm-ai-gateway:release .

      - name: Validate Compose stack
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/multi-llm-ai-gateway
          helm template release deploy/helm/multi-llm-ai-gateway >/tmp/rendered.yaml
          helm template release-hardening deploy/helm/multi-llm-ai-gateway \
            --set networkPolicy.enabled=true \
            --set serviceMonitor.enabled=true >/tmp/rendered-hardening.yaml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure local secrets are not committed
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          ! git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'
      - name: Dependency audit
        run: |
          python -m pip install -e .
          python -m pip install pip-audit
          pip-audit

  release:
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          PREVIOUS_TAG="$(git tag --sort=-version:refname | head -n 1 || true)"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              --notes-start-tag "$PREVIOUS_TAG"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
