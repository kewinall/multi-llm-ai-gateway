name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build container
        run: docker build -t multi-llm-ai-gateway:ci .

      - name: Validate Compose stack
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/multi-llm-ai-gateway
          helm template ci deploy/helm/multi-llm-ai-gateway >/tmp/rendered.yaml
          helm template ci-hardening deploy/helm/multi-llm-ai-gateway \
            --set networkPolicy.enabled=true \
            --set serviceMonitor.enabled=true >/tmp/rendered-hardening.yaml

